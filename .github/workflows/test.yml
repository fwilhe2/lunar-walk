name: Test

# Types and the Vitest suite on their own, so they report as a check of
# their own in minutes, without waiting for the desktop builds (which
# run them again on macOS and Windows, for the other CPU and engine).

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Check and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version   # the kernel fingerprints are V8's, version by version
      - run: npm ci
      - run: npm run check
      - run: npm run test
